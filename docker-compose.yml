services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - HOST=${HOST}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_SECRET_OLD=${JWT_SECRET_OLD}
      - LIVE_JWT_SECRET=${LIVE_JWT_SECRET}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - API_ENDPOINT=${API_ENDPOINT}
      - X_POL_RFX_TOKEN=${X_POL_RFX_TOKEN}
      - X_POL_RFX_SECRET=${X_POL_RFX_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - BUCKET_PUBLIC_DOMAIN=${BUCKET_PUBLIC_DOMAIN}
      - BID_EMAIL_SUBJECT=${BID_EMAIL_SUBJECT}
      - REDIS_HOST=${REDIS_HOST}
      - SERVER_HOST=${SERVER_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SESSION_NAME=${SESSION_NAME}
      - SESSION_REFRESH_NAME=${SESSION_REFRESH_NAME}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - POLRFXMINIOPASS=${POLRFXMINIOPASS}
      - POLRFXPASS=${POLRFXPASS}
      - POLRFXUSER=${POLRFXUSER}
    volumes:
      # Persist uploads directory
      - polrfx_frontend_app_uploads:/app/uploads
      # Persist any static content
      - polrfx_frontend_app_static:/app/public
      # For development, you might want to mount your source code (comment out in production)
      # - .:/app
      - .:/app
      # Persist any logs
      - polrfx_frontend_app_logs:/app/logs

volumes:
  polrfx_frontend_app_uploads:
  polrfx_frontend_app_static:
  polrfx_frontend_app_logs: